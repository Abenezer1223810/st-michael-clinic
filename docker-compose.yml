version: '3.8'

services:
  # ========================================================
  # 1. PostgreSQL 16 Relational Database Engine
  # ========================================================
  db:
    image: postgres:16-alpine
    container_name: stm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: st_michael_hms
      POSTGRES_USER: stm_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-StMichaelSecure2026!}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stm_admin -d st_michael_hms"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stm_network

  # ========================================================
  # 2. Node.js Backend API & LIS Hardware Integrations
  # ========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stm-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://stm_admin:${DB_PASSWORD:-StMichaelSecure2026!}@db:5432/st_michael_hms?schema=public
      JWT_SECRET: ${JWT_SECRET:-StMichael_Prod_SuperSecret_JwtKey_2026_x99!}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:80}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:5000/health\").then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))'"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - stm_network

  # ========================================================
  # 3. Nginx Reverse Proxy & Frontend Web Application
  # ========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - stm_network

volumes:
  postgres_data:
    name: stm_postgres_data

networks:
  stm_network:
    name: stm_network
    driver: bridge

